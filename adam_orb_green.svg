<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="orbGlow" cx="50%" cy="42%" r="55%">
      <stop offset="0%" stop-color="#69F0AE"/>
      <stop offset="45%" stop-color="#00E676"/>
      <stop offset="100%" stop-color="#00331A"/>
    </radialGradient>
    <linearGradient id="ringGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00E676"/>
      <stop offset="100%" stop-color="#1B5E20"/>
    </linearGradient>
  </defs>
  <!-- black rounded background -->
  <rect width="512" height="512" rx="112" fill="#000000"/>
  <rect x="8" y="8" width="496" height="496" rx="104" fill="none" stroke="#00E676" stroke-width="6" opacity="0.35"/>
  <!-- outer orbit ring -->
  <circle cx="256" cy="248" r="150" fill="none" stroke="url(#ringGrad)" stroke-width="6"/>
  <circle cx="256" cy="248" r="150" fill="none" stroke="#00E676" stroke-width="2" opacity="0.25"/>
  <!-- orbit dots (binary satellites) -->
  <circle cx="256" cy="98" r="14" fill="#00E676"/>
  <text x="256" y="104" font-family="monospace" font-size="16" font-weight="bold" text-anchor="middle" fill="#000">1</text>
  <circle cx="380" cy="320" r="11" fill="#69F0AE"/>
  <text x="380" y="325" font-family="monospace" font-size="13" font-weight="bold" text-anchor="middle" fill="#000">0</text>
  <circle cx="132" cy="320" r="11" fill="#69F0AE"/>
  <text x="132" y="325" font-family="monospace" font-size="13" font-weight="bold" text-anchor="middle" fill="#000">1</text>
  <!-- main orb -->
  <circle cx="256" cy="248" r="104" fill="url(#orbGlow)"/>
  <circle cx="256" cy="248" r="104" fill="none" stroke="#00E676" stroke-width="3" opacity="0.8"/>
  <!-- mic glyph -->
  <g fill="#00180C">
    <rect x="240" y="196" width="32" height="64" rx="16"/>
    <path d="M216 252 c0 26 17 44 40 44 s40 -18 40 -44 h-10 c0 20 -13 34 -30 34 s-30 -14 -30 -34 z" />
    <rect x="251" y="296" width="10" height="18" rx="3"/>
    <rect x="232" y="314" width="48" height="8" rx="4"/>
  </g>
  <!-- waveform bars -->
  <g fill="#00180C" opacity="0.9">
    <rect x="158" y="238" width="10" height="20" rx="5"/>
    <rect x="176" y="228" width="10" height="40" rx="5"/>
    <rect x="326" y="228" width="10" height="40" rx="5"/>
    <rect x="344" y="238" width="10" height="20" rx="5"/>
  </g>
  <!-- binary rain -->
  <g font-family="monospace" font-size="20" fill="#00E676" opacity="0.9">
    <text x="120" y="120">0</text>
    <text x="150" y="100">1</text>
    <text x="360" y="110">1</text>
    <text x="388" y="135">0</text>
    <text x="110" y="400">1</text>
    <text x="395" y="400">0</text>
  </g>
  <text x="256" y="448" font-family="monospace" font-size="44" font-weight="bold" letter-spacing="12" text-anchor="middle" fill="#00E676">ADAM</text>
  <text x="256" y="474" font-family="monospace" font-size="15" letter-spacing="4" text-anchor="middle" fill="#8FA598">OFFLINE • PRIVATE • ON-DEVICE</text>
</svg>
